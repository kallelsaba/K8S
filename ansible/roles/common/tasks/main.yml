---
# ============================================================
# COMMON ROLE — runs on every k8s node (master + workers)
# ============================================================

# ---- prerequisites -----------------------------------------
- name: Ensure prerequisites are installed
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - apt-transport-https
      - software-properties-common
      - gnupg
      - nfs-common
      - jq
    state: present
    update_cache: true

# ---- DNS ---------------------------------------------------
- name: Ensure resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Configure DNS servers for systemd-resolved
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns_servers.conf
    mode: "0644"
    content: |
      [Resolve]
      DNS={{ network.dns_servers | join(' ') }}

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

# ---- /etc/hosts --------------------------------------------
- name: Ensure controlplane entry exists in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ controlplane.ip }} {{ controlplane.name }}"
    state: present

- name: Ensure worker entries exist in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.name }}"
    state: present
  loop: "{{ workers }}"

# ---- swap --------------------------------------------------
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# \1'

# ---- kernel modules & sysctl --------------------------------
- name: Configure kernel modules for Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay module
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl params for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl params
  ansible.builtin.command: sysctl --system
  changed_when: false

# ---- CRI-O -------------------------------------------------
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - crio

- name: Download CRI-O repo key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/addons:/cri-o:/prerelease:/main/deb/Release.key
    dest: /tmp/crio-release.key
    mode: "0644"
  tags:
    - crio

- name: Install CRI-O keyring
  ansible.builtin.command: >
    gpg --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg /tmp/crio-release.key
  args:
    creates: /etc/apt/keyrings/cri-o-apt-keyring.gpg
  tags:
    - crio

- name: Configure CRI-O apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cri-o.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://pkgs.k8s.io/addons:/cri-o:/prerelease:/main/deb/ /
  tags:
    - crio

- name: Install CRI-O
  ansible.builtin.apt:
    name: cri-o
    state: present
    update_cache: true
  tags:
    - crio

- name: Enable and start CRI-O
  ansible.builtin.systemd:
    name: crio
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - crio

- name: Ensure CRI-O config drop-in directory exists
  ansible.builtin.file:
    path: /etc/crio/crio.conf.d
    state: directory
    mode: "0755"
  tags:
    - crio

- name: Configure CRI-O insecure registries (update IPs as needed)
  ansible.builtin.copy:
    dest: /etc/crio/crio.conf.d/10-insecure-registries.conf
    mode: "0644"
    content: |
      [crio.image]
      insecure_registries = ["{{ nexus_hostname }}:{{ nexus_docker_port }}", "{{ nexus_hostname }}"]
  notify: Restart CRI-O
  tags:
    - crio

# ---- Kubernetes tooling ------------------------------------
- name: Derive short Kubernetes version (e.g. 1.31 from 1.31.0-*)
  ansible.builtin.set_fact:
    kubernetes_version_short: "{{ software.kubernetes[0:4] }}"

- name: Download Kubernetes repo key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_short }}/deb/Release.key"
    dest: /tmp/k8s-release.key
    mode: "0644"

- name: Install Kubernetes keyring
  ansible.builtin.command: >
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/k8s-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Configure Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_short }}/deb/ /

- name: Install kubelet, kubeadm, kubectl (pinned)
  ansible.builtin.apt:
    name:
      - "kubelet={{ software.kubernetes }}"
      - "kubectl={{ software.kubernetes }}"
      - "kubeadm={{ software.kubernetes }}"
    state: present
    update_cache: true

- name: Hold Kubernetes + CRI-O packages (prevent auto-upgrade)
  ansible.builtin.command: apt-mark hold kubelet kubectl kubeadm cri-o
  changed_when: false

# ---- kubelet node-ip ----------------------------------------
- name: Ensure /etc/default directory exists
  ansible.builtin.file:
    path: /etc/default
    state: directory
    mode: "0755"

- name: Compute node_ip from topology
  ansible.builtin.set_fact:
    node_ip: >-
      {{
        (inventory_hostname == controlplane.name)
        | ternary(
            controlplane.ip,
            (workers | selectattr('name', 'equalto', inventory_hostname) | map(attribute='ip') | first)
          )
      }}

- name: Fallback node_ip to default IPv4 if topology lookup failed
  ansible.builtin.set_fact:
    node_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
  when: node_ip is not defined or node_ip is none or node_ip | length == 0

- name: Configure kubelet node-ip
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}

# ---- NFS client  ----------------------------------
- name: Install NFS client package
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
